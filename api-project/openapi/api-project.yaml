openapi: 3.0.4
info:
  title: ODS API Server
  description: API documentation for ODS (Open DevStack) API Service
  contact:
    name: ODS Team
  version: v0.0.1
servers:
  - url: http://{baseurl}/api/pub/v0
    variables:
      baseurl:
        default: localhost:8080
        description: Development environment
tags:
- name: Project
  description: API for manage EDP projects.
paths:
  /projects:
    post:
      tags:
      - Projects
      summary: Create a new project.
      description: Creates a new project with the provided configuration. Generates a unique project key if not provided.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project creation initiated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          description: Invalid request body or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        "401":
          description: Invalid client token on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorMessage'
        "403":
          description: Insufficient permissions for the client to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorMessage'
        '409':
          description: A project with the specified key already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '500':
          description: Internal server error during project creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
  /projects/{projectKey}:
    get:
      tags:
      - Projects
      summary: Get project status by project key.
      description: Returns the current status and details of the project identified by the given project key.
      operationId: getProject
      parameters:
      - name: projectKey
        in: path
        required: true
        schema:
          type: string
        description: Project key to retrieve information.
      responses:
        '200':
          description: Project information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        "401":
          description: Invalid client token on the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorMessage'
        "403":
          description: Insufficient permissions for the client to access the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorMessage'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
components:
  schemas:
    RestErrorMessage:
      properties:
        message:
          type: string
      required:
        - message
    CreateProjectRequest:
      type: object
      properties:
        projectKey:
          type: string
          description: Optional project key. If not provided, a unique key will be generated.
          pattern: "^[A-Z]{2}[A-Z0-9]{1,8}$"
          minLength: 3
          maxLength: 10
        projectName:
          type: string
          description: Name of the project.
          pattern: "^[A-Za-z0-9 ]{0,80}$"
          maxLength: 80
        projectDescription:
          type: string
          description: Description of the project.
          maxLength: 255
        projectFlavor:
          type: string
          description: Flavor of the project. Either projectFlavor or configurationItem must be provided.
        configurationItem:
          type: string
          description: Configuration item for the project. Either projectFlavor or configurationItem must be provided.
        location:
          type: string
          description: Location of the project. Must be one of the allowed locations. If not in the allowed list, error INVALID_LOCATION (011) is returned.
        x2OdsAccount:
          type: string
          description: Technical account of the project.
          pattern: "^[a-z]{1,10}$"
        owner:
          type: string
          description: Owner of the project. If x2OdsAccount is provided but owner is missing, error MANDATORY_OWNER (024) is returned.
          pattern: "^x2[a-zA-Z0-9]{0,13}$"
      oneOf:
        - required: [projectFlavor]
        - required: [configurationItem]
      additionalProperties: false
    CreateProjectResponse:
      type: object
      properties:
        projectKey:
          type: string
        httStatus:
          type: string
        status:
          type: string
        projectFlavor:
          type: string
        message:
          type: string
        error:
          type: string
        errorKey:
          type: string
        errorDescription:
          type: string
        location:
          type: string