openapi: 3.0.3
info:
  title: Project Technologies API
  description: Returns technologies used by a project from Marketplace
  contact:
    name: ODS Team
  version: v0.0.1
servers:
  - url: http://{baseurl}/api/v1
    variables:
      baseurl:
        default: localhost:8080
        description: Development environment
security:
  - bearerAuth: []
tags:
  - name: ProjectTechnologies
    description: Technologies used by a project
paths:
  /projects/{projectKey}/technologies:
    get:
      tags:
        - ProjectTechnologies
      summary: Returns the set of technologies used by a project.
      operationId: getProjectTechnologies
      parameters:
        - name: projectKey
          in: path
          description: project key.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A list of Technologies used by the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectTechnology'
        "401":
          $ref: '#/components/responses/UnauthorizedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
components:
  responses:
    UnauthorizedResponse:
      description: Invalid or missing client token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestErrorMessage'
    ForbiddenResponse:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestErrorMessage'
  schemas:
    RestErrorMessage:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ProjectTechnology:
      properties:
        slug:
          type: string
          example: my-item-slug
        name:
          type: string
          example: my-item-name
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT