openapi: 3.0.3
info:
  title: ODS API Server
  description: API documentation for ODS (Open DevStack) API Service
  contact:
    name: ODS Team
  version: v0.0.1
servers:
  - url: http://{baseurl}/api/pub/v0
    variables:
      baseurl:
        default: localhost:8080
        description: Development environment
tags:
  - name: Project Components V0 Internal
    description: API for managing project components with extended methods

paths:
  /projects/{projectId}/components/{componentId}:
    delete:
      tags:
        - Project Components v0 Internal
      summary: Delete component information
      operationId: deleteProjectComponent
      description: Deletes a specific component
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project key
          schema:
            type: string
        - name: componentId
          in: path
          required: true
          description: Component id
          schema:
            type: string
      responses:
        '200':
          description: Component information

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      headers:
        WWW_Authenticate:
          schema:
            type: string
