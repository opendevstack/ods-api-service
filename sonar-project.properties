# SonarQube configuration for the ODS API Service multi-module repository
# Tune sonar.projectKey to match your SonarQube project identifier.

sonar.projectKey=org.opendevstack.apiservice:ods-api-service
sonar.projectName=ODS API Service
sonar.sourceEncoding=UTF-8

# Analyze Java sources from all Maven modules.
sonar.sources=.
sonar.tests=.

# Restrict indexing to standard Maven source/test folders.
sonar.inclusions=**/src/main/java/**/*.java
sonar.test.inclusions=**/src/test/java/**/*.java

# Ignore build output, generated code, and non-source artifacts.
sonar.exclusions=**/target/**,**/openapi/**,**/doc/**,**/.mvn/**

# Java bytecode locations needed for semantic analysis.
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

# Unit test and coverage reports produced by Maven plugins.
sonar.junit.reportPaths=**/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
